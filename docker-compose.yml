services:
  frontend:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "${DASH_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
      # redis:
    profiles:
      - frontend

  backend:
    build: ./pipe
    container_name: pipe
    stdin_open: true
    tty: true
    environment:
      PYTHONPATH: /app
      DB_HOST: ${DB_HOST}
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    volumes:
      - ./pipe:/app
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - backend
  db:
    image: mariadb:lts
    container_name: mariadb
    restart: always
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - frontend
      - backend
      - database

  whisper:
    build: ./pipe/Whisper
    container_name: whisper
    stdin_open: true
    tty: true
    ports:
      - ${API_ENDPOINT_PORT}:5000
    profiles:
      - whisper

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      # - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    restart: always
    profiles:
      - redis

volumes:
  mariadb_data:
